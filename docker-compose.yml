services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wardrobe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  api:
    build: ./server
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/wardrobe
    ports: ["3000:3000"]
    depends_on: [postgres]
volumes:
  postgres_data:
